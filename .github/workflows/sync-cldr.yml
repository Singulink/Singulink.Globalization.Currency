name: sync CLDR data

# Checks the npm registry for a new CLDR release every week. When one is found, the currency data is regenerated, built and tested, and committed to main.
# The Singulink.Globalization.Currency.Cldr package is then published to NuGet whenever the committed package version is not on nuget.org yet, so a failed
# publish is retried simply by re-running the workflow. The data package depends only on the DataProviders package, so this never publishes or changes the
# core library.
#
# Publishing uses NuGet trusted publishing (OIDC), which requires a one-time setup on nuget.org that links the Singulink.Globalization.Currency.Cldr package
# to this repository and workflow. See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing. The NUGET_USER repository variable must be set to the
# nuget.org user name that owns the trusted publishing policy.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays at 06:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: CLDR version to sync (defaults to the latest version on npm)
        required: false
      force:
        description: Regenerate and publish even if the version has not changed (bumps the package revision)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  sync:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Determine versions
      id: versions
      shell: pwsh
      run: |
        $latest = if ('${{ inputs.version }}') { '${{ inputs.version }}' } else { (Invoke-RestMethod 'https://registry.npmjs.org/cldr-core')['dist-tags'].latest }
        $props = Get-Content 'Source/Singulink.Globalization.Currency.Cldr/Cldr.Version.props' -Raw
        $current = [regex]::Match($props, '<CldrVersion>([^<]+)</CldrVersion>').Groups[1].Value
        $revision = [int][regex]::Match($props, '<CldrPackageRevision>(\d+)</CldrPackageRevision>').Groups[1].Value

        Write-Host "Current CLDR version: $current (revision $revision), latest: $latest"

        $changed = $latest -ne $current
        $force = '${{ inputs.force }}' -eq 'true'
        $regenerate = $changed -or $force

        if ($changed) { $newRevision = 0 } elseif ($force) { $newRevision = $revision + 1 } else { $newRevision = $revision }

        $packageVersion = if ($newRevision -eq 0) { $latest } else { "$latest.$newRevision" }

        # Publish whenever the package version that will be committed (or is already committed) is not on nuget.org, so that a previously failed publish
        # is retried by re-running the workflow without regenerating anything or bumping the revision.
        $published = (Invoke-RestMethod 'https://api.nuget.org/v3-flatcontainer/singulink.globalization.currency.cldr/index.json').versions
        $publish = $regenerate -or ($published -notcontains $packageVersion)

        Write-Host "Package version: $packageVersion (regenerate: $regenerate, publish: $publish)"

        "latest=$latest" >> $env:GITHUB_OUTPUT
        "regenerate=$regenerate" >> $env:GITHUB_OUTPUT
        "publish=$publish" >> $env:GITHUB_OUTPUT
        "revision=$newRevision" >> $env:GITHUB_OUTPUT

    - name: Regenerate data
      if: steps.versions.outputs.regenerate == 'True'
      shell: pwsh
      run: |
        dotnet run --project Tools/CldrDataGenerator -c Release -- ${{ steps.versions.outputs.latest }}
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        # The generator preserves the revision for an unchanged version; apply the bumped revision when forcing a republish.
        $path = 'Source/Singulink.Globalization.Currency.Cldr/Cldr.Version.props'
        $props = Get-Content $path -Raw
        $props = $props -replace '<CldrPackageRevision>\d+</CldrPackageRevision>', '<CldrPackageRevision>${{ steps.versions.outputs.revision }}</CldrPackageRevision>'
        Set-Content $path $props -NoNewline

        Write-Host 'Changed files:'
        git status --short
        git diff --stat

    - name: Build and test
      if: steps.versions.outputs.publish == 'True'
      run: |
        dotnet build --configuration Release
        dotnet test --configuration Release --no-build --verbosity normal

    - name: Verify DataProviders package is published
      if: steps.versions.outputs.publish == 'True'
      shell: pwsh
      run: |
        # The data package depends on the DataProviders package version it was built against, which must already exist on nuget.org.
        [xml]$proj = Get-Content 'Source/Singulink.Globalization.Currency.DataProviders/Singulink.Globalization.Currency.DataProviders.csproj'
        $version = $proj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        $index = Invoke-RestMethod 'https://api.nuget.org/v3-flatcontainer/singulink.globalization.currency.dataproviders/index.json'

        if ($index.versions -notcontains $version) {
          Write-Error "Singulink.Globalization.Currency.DataProviders $version is not published on nuget.org. Publish it before syncing CLDR data."
          exit 1
        }

    - name: Commit and push
      if: steps.versions.outputs.regenerate == 'True'
      shell: pwsh
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add Source/Singulink.Globalization.Currency.Cldr
        git status --short

        # Every command must be checked individually: a pwsh step only fails on the exit code of its last command.
        git commit -m "Update CLDR currency data to ${{ steps.versions.outputs.latest }}"
        if ($LASTEXITCODE -ne 0) { Write-Error 'Nothing was committed. The regenerated data did not change any tracked files.'; exit 1 }

        git push
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Pack
      if: steps.versions.outputs.publish == 'True'
      run: |
        dotnet clean --configuration Release
        dotnet build Source/Singulink.Globalization.Currency.Cldr --configuration Release

    # Always log in, even when there is nothing to publish, so that a broken trusted publishing setup fails every run instead of only the rare run that
    # has a new CLDR release to publish. The login only obtains a short-lived API key.
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish
      if: steps.versions.outputs.publish == 'True'
      shell: pwsh
      run: |
        $package = Get-ChildItem 'Source/Singulink.Globalization.Currency.Cldr/bin/Release/*.symbols.nupkg' | Select-Object -First 1
        dotnet nuget push $package.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
